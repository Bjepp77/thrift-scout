name: Daily Thrift Scout Scan

on:
  schedule:
    - cron: "0 14 * * *"   # 7:00 AM Mountain Time (UTC-7)
  workflow_dispatch:        # manual trigger from Actions tab

# A manual run started while the cron run is still going would scan, email and
# add to the watchlist twice. Queue the second one instead of racing it; never
# cancel in progress, since a half-finished scan can leave items marked seen.
concurrency:
  group: thrift-scout-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A healthy run takes 4-6 minutes. Without this, a hung request against
    # ShopGoodwill sits on GitHub's default 6-hour job limit before anyone
    # notices. 30 gives ample headroom while capping the damage.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SGW_USERNAME: ${{ secrets.SGW_USERNAME }}
          SGW_PASSWORD: ${{ secrets.SGW_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Preferred. Once this is set and a run is verified, the anon
          # secret above can be deleted and public can be denied in RLS.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m thrift_scout run
